<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Yala-Maha Assist · Farmer Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">

<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--body:#475569;--line:#E2E8F0;--line2:#CBD5E1;--pri:#0F766E;--soft:#F1F5F9;--pill:#CCFBF1;--rel:#F0FDFA;--rel-b:#99F6E4;--day:#ECFDF5;--day-t:#047857;--red:#BE123C;--red-arc:#F43F5E;--red-bg:#FFF1F2;--red-b:#FECDD3;--focus:#14B8A6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.app{max-width:430px;margin:0 auto;padding:12px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--pri);font-size:15px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.seg{display:flex;align-items:center;gap:6px;color:var(--mut)}
.seg div{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font:600 12px inherit;font-family:inherit;padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;font:600 13px inherit;font-family:inherit;color:var(--mut);padding:8px 0 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
h1{font-size:27px;line-height:1.25;font-weight:800;margin:6px 0 8px;color:var(--ink)}
.sub{color:var(--mut);font-size:14px;line-height:1.5;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tank{font-size:23px;font-weight:800;color:var(--ink)}
.small{font-size:12.5px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--red);background:var(--red-bg);border:1px solid var(--red-b);padding:3px 9px;border-radius:999px;white-space:nowrap}
.ring{display:grid;place-items:center;padding:6px 0}
.ring svg{width:170px;height:170px}
.warn{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--red);font-weight:700;font-size:13px;margin-top:8px;line-height:1.4}
.release{background:var(--rel);border-color:var(--rel-b)}
.label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--body);margin-bottom:6px}
.big{font-size:23px;font-weight:800;color:var(--pri);line-height:1.3}
.h3{font-size:15px;font-weight:700;display:flex;gap:6px;align-items:center;margin-bottom:10px;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.day{background:var(--day);border-radius:10px;padding:9px 6px;text-align:center}
.day span{display:block;font-size:11.5px;color:var(--mut)}
.day b{font-size:15px;color:var(--day-t)}
.tip{font-size:12.5px;color:var(--body);line-height:1.55}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--ink)}
select,textarea,input.f{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:15px inherit;font-family:inherit}
::placeholder{color:#94A3B8}
textarea{height:90px;resize:none}
select:focus,textarea:focus,input:focus{outline:2px solid var(--focus);outline-offset:0}
.btn{width:100%;border:0;background:var(--pri);color:#fff;font:700 15px inherit;font-family:inherit;padding:14px;border-radius:12px;margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.btn:active{transform:scale(.99)}
.phone{display:flex;gap:8px}
.cc{background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-weight:600;color:var(--mut)}
.pf{position:relative;flex:1}.pf svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.pf .f{padding-left:36px}
.err{outline:2px solid var(--red)!important}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 4px}
.otp input{width:100%;aspect-ratio:1;text-align:center;font:700 20px inherit;font-family:inherit;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);padding:0}
.otp input:focus{border-color:var(--focus);outline:2px solid var(--pill)}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
.links button{background:none;border:0;color:var(--pri);font:700 12.5px inherit;font-family:inherit;cursor:pointer;text-align:start}
.links span{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</head>

  const isFloodActive=storedAlert?storedAlert.active:true;
  const peakDisp=storedAlert&&storedAlert.peak?storedAlert.peak:"4.82 m (107%)";
  const timeDisp=storedAlert&&storedAlert.time?(lang==='si'?'බ්‍රහස්පතින්දා සවස':lang==='ta'?'வியாழன் மாலை':storedAlert.time):(lang==='si'?'බ්‍රහස්පතින්දා සවස':lang==='ta'?'வியாழன் மாலை':'Thursday evening');
  let fHtml='';
  if(isFloodActive){
    fHtml=`<div class="card" style="background:var(--red-bg);border:1.5px solid var(--red-b);padding:14px 16px;margin:10px 0 14px"><div class="row" style="align-items:flex-start;gap:10px"><div style="display:flex;gap:10px;align-items:flex-start"><span style="color:var(--red);margin-top:2px">${ico.warn}</span><div><div style="font-weight:800;font-size:13px;color:var(--red);letter-spacing:.02em;text-transform:uppercase">${t.floodTitle}</div><div style="font-size:12.5px;line-height:1.5;color:var(--ink);margin-top:4px;font-weight:500">${t.floodMsg}</div><div style="font-size:11.5px;color:var(--body);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap"><span><b>${t.floodPeakLabel}:</b> ${peakDisp}</span><span><b>${t.floodTimeLabel}:</b> ${timeDisp}</span></div></div></div><span class="badge" style="background:#fff;border-color:var(--red-b);color:var(--red)">${t.floodBadge}</span></div></div>`;
  }
  if(scr==2)h=`<div class="row" style="align-items:flex-start;margin-top:4px"><div><div class="tank">${t.tank}</div><div class="small">${t.loc}</div></div><span class="badge">${ico.warn}${t.crit}</span></div>${fHtml}<div class="card" style="margin-top:14px"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#E2E8F0" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" stroke-dasharray="56.5 314.2" transform="rotate(-90 60 60)"/><text x="60" y="64" text-anchor="middle" font-size="26" font-weight="800" fill="#BE123C" font-family="Inter,sans-serif">18%</text><text x="60" y="80" text-anchor="middle" font-size="9" fill="#64748B">${t.of}</text></svg></div><div class="warn">${ico.drop}<span>${t.low}</span></div></div>
  <div class="card release"><div class="label">${ico.cal}${t.next}</div><div class="big">${t.when}</div></div>
  <div class="card"><div class="h3">${ico.cloud}${t.rain}</div><div class="days">${t.d.map((d,i)=>`<div class="day"><span>${d}</span><b>${[2,6,4][i]} ${t.mm}</b></div>`).join('')}</div><p class="tip">${t.advice}</p></div>
  <div class="card"><div class="h3">${ico.tool}${t.rep}</div><label style="margin-top:0">${t.type}</label><select>${t.opts.map(o=>`<option>${o}</option>`).join('')}</select><label>${t.desc}</label><textarea placeholder="${t.ph}"></textarea><button class="btn" id="go3">${t.send}</button></div>`;
  $('#view').innerHTML=h;bind();
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function bind(){
  const t=T[lang];
  if($('#go1'))$('#go1').onclick=()=>{const v=$('#ph').value.replace(/\D/g,'');if(v.length<9){$('#ph').classList.add('err');toast(t.bad);return}phone=v.replace(/(\d{2})(\d{3})(\d+)/,'$1 $2 $3');scr=1;render()};
  if($('#otp')){const ins=[...document.querySelectorAll('#otp input')];(ins.find(x=>!x.value)||ins[5]).focus();
    ins.forEach((el,i)=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,'');if(el.value&&ins[i+1])ins[i+1].focus()};el.onkeydown=e=>{if(e.key=='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()}});
    $('#go2').onclick=()=>{scr=2;render()};$('#chg').onclick=()=>{scr=0;render()};
    cd=30;const tick=()=>{const r=$('#res');if(!r)return;r.textContent=cd>0?t.res.replace('{n}',cd):'↻';};tick();
    timer=setInterval(()=>{if(cd>0)cd--;tick()},1000)}
  if($('#go3'))$('#go3').onclick=()=>toast(t.sent);
}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){scr=+b.dataset.s;render()}};
$('#langs').onclick=e=>{const b=e.target.closest('button');if(b){lang=b.dataset.l;render()}};
render();
</script>
</body>
</html>

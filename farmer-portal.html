<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yala-Maha Assist · Farmer Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
/* Farmer portal mobile container constraint */
.app { max-width: 430px; margin: 0 auto; }
.tabs { overflow-x: auto; }
.tabs button { white-space: nowrap; }
</style>
<script src="river-config.js"></script>
<script src="farm-config.js"></script>
<script src="js/icons.js"></script>
<script src="js/translations.js"></script>
<script src="js/schematic-map.js"></script>
<script src="js/farmer-portal.js"></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo"><svg class="i" style="color:#fff;width:15px;height:15px" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div>Yala-Maha Assist</div>
    <div class="seg"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
      <div id="langs"><button data-l="en" class="on">EN</button><button data-l="si">සි</button><button data-l="ta">த</button></div></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const portalTabs = $('#tabs');
  if (portalTabs) {
    portalTabs.onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      const s = +b.dataset.s;
      if (s === 0) scr = 0;
      else if (s === 1) scr = 1;
      else if (s === 2) scr = 'reg1';
      else if (s === 3) scr = 2;
      render();
    };
  }

  const langsEl = $('#langs');
  if (langsEl) {
    langsEl.onclick = e => {
      const b = e.target.closest('button');
      if (b && b.dataset.l) {
        lang = b.dataset.l;
        render();
      }
    };
  }

  render();
});
</script>
</body>
</html>
